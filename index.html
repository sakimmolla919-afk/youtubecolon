<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTube - Modern Stream</title>
    <!-- Telegram WebApp SDK for Full Height Expansion -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #121215;
            --bg-card: #18181b;
            --bg-glass: rgba(18, 18, 21, 0.85);
            --accent: #ff0033;
            --accent-hover: #d9002b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }

        /* Glassmorphic Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .logo-icon {
            background: linear-gradient(135deg, #ff0033, #ff4d4d);
            color: white;
            width: 30px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            box-shadow: 0 2px 10px rgba(255, 0, 51, 0.4);
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 550px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: rgba(255, 0, 51, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.15);
        }

        .search-box input {
            width: 100%;
            padding: 9px 16px;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box button {
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            border-left: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .search-box button:hover { background: rgba(255, 255, 255, 0.1); }

        .profile-menu { position: relative; flex-shrink: 0; }
        .profile-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0033, #99001f);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.2s;
        }
        .profile-icon:active { transform: scale(0.92); }

        .settings-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 46px;
            background: #1c1c20;
            width: 210px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            z-index: 200;
        }
        .settings-dropdown.active { display: block; animation: fadeIn 0.15s ease-out; }
        .settings-dropdown div {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .settings-dropdown div:last-child { border-bottom: none; }
        .settings-dropdown div:hover { background: rgba(255, 255, 255, 0.06); }

        /* Category Chips */
        .category-bar {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            overflow-x: auto;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip:hover, .chip.active {
            background: var(--text-main);
            color: var(--bg-primary);
            border-color: var(--text-main);
        }

        /* Layout */
        .main-layout { display: flex; height: calc(100vh - 105px); }

        /* Sidebar */
        .sidebar {
            width: 76px;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 14px;
            gap: 12px;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .sidebar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            gap: 6px;
            width: 62px;
            padding: 10px 4px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .sidebar-item:hover, .sidebar-item.active {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.08);
        }
        .sidebar-item.active svg { color: var(--accent); }

        /* Content Area */
        .content {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            background-color: var(--bg-primary);
        }

        /* Player View */
        .player-view {
            display: none;
            width: 100%;
            max-width: 960px;
            margin: 0 auto 24px auto;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-top: 14px;
            padding: 0 4px;
        }
        .video-title {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
        }
        .fs-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .fs-btn:hover { background: var(--accent); border-color: var(--accent); }

        /* Grid */
        h2.section-title {
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }
        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .video-card:hover img { transform: scale(1.05); }

        .video-info { padding: 0 4px 4px 4px; }
        .video-info h3 {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-info p {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        .loading-text {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 14px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive Bottom Bar */
        @media (max-width: 768px) {
            .main-layout { height: calc(100vh - 102px); }
            .sidebar {
                flex-direction: row;
                width: 100%;
                height: 60px;
                position: fixed;
                bottom: 0;
                left: 0;
                border-top: 1px solid var(--border-color);
                border-right: none;
                z-index: 100;
                justify-content: space-around;
                padding: 0;
                background: var(--bg-glass);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
            }
            .sidebar-item {
                width: auto;
                flex: 1;
                height: 100%;
                justify-content: center;
                border-radius: 0;
                gap: 4px;
            }
            .sidebar-item:hover { background-color: transparent; }
            .content { padding: 14px 14px 80px 14px; }
            .video-grid { gap: 14px; }
            .player-footer { flex-direction: column; }
            .fs-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="loadHome()">
            <div class="logo-icon">▶</div>
            <span>TeleTube</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search videos or paste YouTube link..." onkeypress="if(event.key==='Enter') handleSearch()">
            <button onclick="handleSearch()" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>
        <div class="profile-menu">
            <div class="profile-icon" onclick="toggleSettings()">S</div>
            <div class="settings-dropdown" id="settingsMenu">
                <div>👤 Sakir Molla</div>
                <div>🌙 Dark Theme (Active)</div>
                <div onclick="clearHistory()">🗑️ Clear Watch History</div>
            </div>
        </div>
    </nav>

    <!-- Quick Filter Chips -->
    <div class="category-bar" id="categoryBar">
        <div class="chip active" onclick="filterCategory(this, 'popular')">🔥 Trending</div>
        <div class="chip" onclick="filterCategory(this, 'Music')">🎵 Music</div>
        <div class="chip" onclick="filterCategory(this, 'Gaming')">🎮 Gaming</div>
        <div class="chip" onclick="filterCategory(this, 'Cricket')">🏏 Cricket</div>
        <div class="chip" onclick="filterCategory(this, 'Hindi Movies Trailer')">🎬 Trailers</div>
        <div class="chip" onclick="filterCategory(this, 'Tech')">💻 Tech</div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-item active" id="nav-home" onclick="loadHome()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </div>
            <div class="sidebar-item" id="nav-shorts" onclick="loadShorts()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span>Shorts</span>
            </div>
            <div class="sidebar-item" id="nav-history" onclick="loadHistory()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>History</span>
            </div>
        </div>

        <div class="content" id="scrollContent">
            <div class="player-view" id="playerView">
                <div class="video-container" id="videoContainer">
                    <iframe id="mainPlayer" 
                        src="" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true">
                    </iframe>
                </div>
                <div class="player-footer">
                    <div class="video-title" id="mainTitle">Video Title</div>
                    <button class="fs-btn" onclick="triggerFullScreen()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                        Fullscreen
                    </button>
                </div>
            </div>

            <h2 class="section-title" id="sectionTitle">Most Popular 🔥</h2>
            <div class="video-grid" id="videoGrid"></div>
            <div class="loading-text" id="loadingText">Loading more videos...</div>
        </div>
    </div>

    <script>
        // Expand Telegram Mini App to Full Screen Height
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const API_KEY = 'AIzaSyCFOKOWRTHy-0invKiBs93Chj3fAm5u8tQ';
        const videoGrid = document.getElementById('videoGrid');
        const sectionTitle = document.getElementById('sectionTitle');
        const playerView = document.getElementById('playerView');
        const scrollContent = document.getElementById('scrollContent');
        const loadingText = document.getElementById('loadingText');

        let nextPageToken = '';
        let isFetching = false;
        let currentApiUrl = '';
        let isCurrentHome = true;

        function setActiveNav(id) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            if(id) document.getElementById(id).classList.add('active');
        }

        function toggleSettings() {
            document.getElementById('settingsMenu').classList.toggle('active');
        }

        // Close settings when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.profile-menu')) {
                document.getElementById('settingsMenu').classList.remove('active');
            }
        });

        // Custom Fullscreen Function for Mobile & Telegram WebView
        function triggerFullScreen() {
            const container = document.getElementById('videoContainer');
            const iframe = document.getElementById('mainPlayer');
            const target = iframe.requestFullscreen ? iframe : container;

            if (target.requestFullscreen) {
                target.requestFullscreen();
            } else if (target.webkitRequestFullscreen) {
                target.webkitRequestFullscreen();
            } else if (target.mozRequestFullScreen) {
                target.mozRequestFullScreen();
            } else if (target.msRequestFullscreen) {
                target.msRequestFullscreen();
            }
        }

        window.onload = loadHome;

        function filterCategory(element, category) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            if (category === 'popular') {
                loadHome();
            } else {
                setActiveNav('nav-home');
                playerView.style.display = 'none';
                sectionTitle.innerText = `${category} Videos`;
                videoGrid.innerHTML = "";
                nextPageToken = '';
                isCurrentHome = false;
                currentApiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(category)}&type=video&key=${API_KEY}`;
                fetchVideos(currentApiUrl, false);
            }
        }

        function loadHome() {
            setActiveNav('nav-home');
            playerView.style.display = 'none';
            sectionTitle.innerText = "Most Popular 🔥";
            videoGrid.innerHTML = "";
            nextPageToken = '';
            isCurrentHome = true;
            currentApiUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=IN&maxResults=20&key=${API_KEY}`;
            fetchVideos(currentApiUrl, true);
        }

        function loadShorts() {
            setActiveNav('nav-shorts');
            playerView.style.display = 'none';
            sectionTitle.innerText = "Trending Shorts ⚡";
            videoGrid.innerHTML = "";
            nextPageToken = '';
            isCurrentHome = false;
            currentApiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=%23shorts&type=video&key=${API_KEY}`;
            fetchVideos(currentApiUrl, false);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;

            const linkRegex = /(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = query.match(linkRegex);

            if (match && match[1]) {
                playVideo(match[1], "Playing from Link", "");
            } else {
                setActiveNav(null);
                playerView.style.display = 'none';
                sectionTitle.innerText = `Results for "${query}"`;
                videoGrid.innerHTML = "";
                nextPageToken = '';
                isCurrentHome = false;
                currentApiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
                fetchVideos(currentApiUrl, false);
            }
        }

        async function fetchVideos(url, isHome) {
            if(isFetching) return;
            isFetching = true;
            loadingText.innerText = "Loading videos...";
            loadingText.style.display = 'block';
            
            try {
                const fetchUrl = nextPageToken ? `${url}&pageToken=${nextPageToken}` : url;
                const response = await fetch(fetchUrl);
                const data = await response.json();
                nextPageToken = data.nextPageToken || '';
                
                let html = '';
                if(data.items) {
                    data.items.forEach(item => {
                        const videoId = isHome ? item.id : item.id.videoId;
                        if(!videoId) return; 
                        
                        const title = item.snippet.title;
                        const channel = item.snippet.channelTitle;
                        const thumbnail = item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url;
                        const safeTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                        html += `
                            <div class="video-card" onclick="playVideo('${videoId}', '${safeTitle}', '${thumbnail}')">
                                <div class="thumb-wrapper">
                                    <img src="${thumbnail}" alt="Thumbnail" loading="lazy">
                                </div>
                                <div class="video-info">
                                    <h3>${title}</h3>
                                    <p>${channel}</p>
                                </div>
                            </div>
                        `;
                    });
                }
                
                videoGrid.innerHTML += html;
                loadingText.style.display = nextPageToken ? 'none' : 'block';
                if(!nextPageToken) loadingText.innerText = "You've reached the end.";

            } catch (error) {
                loadingText.innerText = "Failed to load videos.";
            }
            isFetching = false;
        }

        scrollContent.addEventListener('scroll', () => {
            if (scrollContent.scrollTop + scrollContent.clientHeight >= scrollContent.scrollHeight - 100) {
                if(nextPageToken && !isFetching && currentApiUrl) {
                    fetchVideos(currentApiUrl, isCurrentHome);
                }
            }
        });

        function playVideo(id, title, thumbnail) {
            playerView.style.display = 'block';
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
            document.getElementById('mainTitle').innerText = title;
            scrollContent.scrollTo({ top: 0, behavior: 'smooth' });

            if (thumbnail && id) {
                let history = JSON.parse(localStorage.getItem('ytHistory')) || [];
                history = history.filter(v => v.id !== id);
                history.unshift({ id, title, thumbnail });
                if(history.length > 50) history.pop();
                localStorage.setItem('ytHistory', JSON.stringify(history));
            }
        }

        function loadHistory() {
            setActiveNav('nav-history');
            playerView.style.display = 'none';
            sectionTitle.innerText = "Watch History 🕒";
            nextPageToken = '';
            currentApiUrl = ''; 
            loadingText.style.display = 'none';
            
            let history = JSON.parse(localStorage.getItem('ytHistory')) || [];
            if(history.length === 0) {
                videoGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding: 40px; color: #a1a1aa;'>No watch history yet.</p>";
                return;
            }

            let html = '';
            history.forEach(v => {
                const safeTitle = v.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                html += `
                    <div class="video-card" onclick="playVideo('${v.id}', '${safeTitle}', '${v.thumbnail}')">
                        <div class="thumb-wrapper">
                            <img src="${v.thumbnail}" alt="Thumbnail">
                        </div>
                        <div class="video-info">
                            <h3>${v.title}</h3>
                            <p>Watched recently</p>
                        </div>
                    </div>
                `;
            });
            videoGrid.innerHTML = html;
        }

        function clearHistory() {
            localStorage.removeItem('ytHistory');
            toggleSettings();
            if(document.getElementById('nav-history').classList.contains('active')) {
                loadHistory();
            }
        }
    </script>

</body>
</html>
